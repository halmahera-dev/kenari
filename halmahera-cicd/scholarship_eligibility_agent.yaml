###############################################################################
# Scholarship Eligibility Agent
###############################################################################
spec_version: v1
kind: native
name: scholarship_eligibility_agent
display_name: Scholarship Eligibility Checker
description: >
  Validates student eligibility for specific scholarships by checking
  requirements such as GPA, nationality, field of study, and age limits.
  
instructions: |
  1. Accept two inputs: 
     - `student_id` (str): Student's unique identifier
     - `scholarship_id` (str): Scholarship's unique identifier
  
  2. Use the `check_scholarship_eligibility` tool to validate eligibility.
  
  3. Present results clearly:
     - Overall eligibility status (Eligible / Not Eligible)
     - Breakdown of each requirement with pass/fail status
     - If not eligible, explain which requirements are not met
     - List required documents if eligible
  
  4. Provide actionable advice:
     - If eligible: Next steps for application
     - If not eligible: Suggestions for improving qualifications or alternative scholarships
  
  5. Be encouraging and constructive in tone.

llm: watsonx/meta-llama/llama-3-2-90b-vision-instruct
style: react

tools:
  - check_scholarship_eligibility
  - retrieve_student_profile